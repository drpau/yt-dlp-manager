[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "yt-dlp-manager"
version = "0.1.0"
description = "A local web interface and queue manager for yt-dlp"
readme = "README.md"
requires-python = ">=3.10"
license = "Unlicense"
dependencies = [
    "brotli",
    "certifi",
    "flask>=3.1,<4",
    "mutagen",
    "pycryptodomex",
    "requests>=2.32.2,<3",
    "urllib3>=2.0.2,<3",
    "websockets>=13.0",
    "yt-dlp-ejs==0.8.0",
]

[project.scripts]
yt-dlp = "yt_dlp:main"
yt-dlp-manager = "manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["yt_dlp", "manager"]

[tool.hatch.build.targets.sdist]
include = [
    "/manager",
    "/test_manager",
    "/yt_dlp",
    "/.gitignore",
    "/LICENSE",
    "/README.md",
    "/THIRD_PARTY_LICENSES.txt",
    "/pyproject.toml",
]

[dependency-groups]
test = ["pytest~=9.0"]

[tool.pytest.ini_options]
addopts = ["-ra", "--tb=short"]
testpaths = ["test_manager"]
