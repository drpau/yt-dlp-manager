name: Bug report
description: Report a problem with YT-DLP Manager.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: what-went-wrong
    attributes:
      label: What went wrong?
      description: Briefly describe the problem.
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest steps that consistently show the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: error-message
    attributes:
      label: Error or message
      description: Paste any relevant error, log, or screenshot details. Remove private information.
      render: text
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and browser
      description: For example, Windows 11 and Chrome 127.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add anything else that may help us investigate.
    validations:
      required: false
